services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot_local_only
      POSTGRES_DB: copilot
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - copilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 2s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: copilotlocal
      MINIO_ROOT_PASSWORD: copilot_local_only
    ports:
      - "127.0.0.1:59000:9000"
    volumes:
      - copilot_minio:/data
volumes:
  copilot_pg:
  copilot_minio:
