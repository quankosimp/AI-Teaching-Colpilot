name: CI Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies (frozen strict)
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Validate and Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate

      - name: Verify Planning Traceability
        run: python3 scripts/check_plans.py

      - name: Typecheck Frontend
        run: pnpm run lint

      - name: Typecheck Server
        run: pnpm run typecheck:server

      - name: Run Test Suites (Recursive Discovery)
        run: pnpm test

      - name: Build Frontend Production Bundle
        run: pnpm run build

      - name: Build Server
        run: pnpm run build:server
